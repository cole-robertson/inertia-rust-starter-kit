# Loco configuration: development.
#
# Every value here can be overridden without editing the file: put a
# `config/development.local.yaml` next to it (git-ignored) or set the env vars
# referenced below.

# Application logging configuration
logger:
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1)
  pretty_backtrace: true
  # Log level, options: trace, debug, info, warn or error.
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  # Define the logging format. options: compact, pretty or json
  format: compact

# Web server configuration
server:
  # No `X-Powered-By: loco.rs` header (Rails sends none).
  ident: ""
  # Every Loco app defaults to 5150, so a second one on this machine will
  # collide. Override without editing this file: `PORT=5151 cargo loco start`.
  port: <%= get_env(name="PORT", default="5150") %>
  # 127.0.0.1, not `localhost`: where `localhost` resolves to ::1 first, binding it left
  # 127.0.0.1 dead. Browsers and curl fall back from ::1 to 127.0.0.1, so both spellings reach
  # this; the CSRF Origin check accepts either in development (src/inertia/csrf.rs).
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  # The UI hostname that mailers point to (links are built from `settings.app_url`).
  host: http://localhost
  middlewares:
    # Files in public/ (Vite output under /vite, icons, robots.txt, error
    # pages) are served by the router fallback in src/inertia/public.rs, only
    # when no route matched: /vite/* is cached immutably, other files for an
    # hour, and a missing file is a real 404. Loco's static layer would serve
    # public/404.html with a 200 and immutable caching instead.
    static:
      enable: false
    # The Inertia stack sets CSP (with a per-request nonce), HSTS and friends;
    # Loco's preset would send a second, conflicting CSP.
    secure_headers:
      enable: false
    # Unknown paths get public/404.html with a 404 status from the public/ fallback.
    fallback:
      enable: false
    limit_payload:
      enable: true
      body_limit: 5mb
    timeout_request:
      enable: true
      timeout: 30000

# Worker Configuration
workers:
  mode: BackgroundQueue

# Queue Configuration (mail is delivered through the SQLite-backed queue)
queue:
  kind: Sqlite
  uri: <%= get_env(name="QUEUE_URL", default="sqlite://loco_development.sqlite?mode=rwc") %>
  dangerously_flush: false

# Mailer Configuration.
mailer:
  # Sending mail in development needs something listening on the port below,
  # e.g. `docker run -p 1025:1025 -p 8025:8025 axllent/mailpit`, then read the
  # mail at http://localhost:8025. Set `stub: true` to skip SMTP entirely.
  smtp:
    enable: true
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    port: <%= get_env(name="MAILER_PORT", default="1025") %>
    secure: false

# Database Configuration
database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://inertia_rust_starter_kit_development.sqlite?mode=rwc") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  # SQLite has one writer at a time, but WAL readers run alongside it; with 1, every request
  # (and the queue worker's mail rendering) waits behind the one connection.
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="5") %>
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

# App settings, typed by `inertia::Settings` (src/inertia/config.rs).
settings:
  # Signs/encrypts cookies (session, flash, CSRF) and purpose tokens.
  # Development-only default; production requires SECRET_KEY_BASE (>= 64 chars).
  secret_key_base: <%= get_env(name="SECRET_KEY_BASE", default="development-secret-key-base-0123456789abcdef0123456789abcdef0123456789abcdef") %>
  # Public base URL: mail links, Origin checks, 409 X-Inertia-Location.
  app_url: <%= get_env(name="APP_URL", default="http://localhost:5150") %>
  app_name: Inertia Rust Starter Kit
  # Other hostnames this app answers on, comma-separated; each has its own session (host-only
  # cookies). Empty: only app_url's host. See the deploy recipe, "More than one hostname".
  extra_hosts: "<%= get_env(name="EXTRA_HOSTS", default="") %>"
  # Who can sign up: open (anyone; without an invitation they get a personal account) or
  # invitation_only (only through a pending invitation, with the address it was sent to).
  sign_up: <%= get_env(name="SIGN_UP", default="open") %>
  mail_from: <%= get_env(name="MAIL_FROM", default="from@example.com") %>
  encrypt_history: false
  forgery_protection: true
  vite:
    # true: tags point at the Vite dev server (run `npx vite`).
    # false: tags come from public/vite/.vite/manifest.json (run `npx vite build`).
    dev_server: <%= get_env(name="VITE_DEV_SERVER", default="true") %>
    dev_server_url: <%= get_env(name="VITE_DEV_SERVER_URL", default="http://localhost:5173") %>
    manifest_path: public/vite/.vite/manifest.json
  # Server-managed <head> tags (inertia-rails' config.server_head). true: tags go to
  # the client as HTML in the `head` prop, SSR renders them and every navigation
  # updates them. Build the client with the same VITE_INERTIA_SERVER_HEAD.
  server_head: <%= get_env(name="VITE_INERTIA_SERVER_HEAD", default="false") %>
  ssr:
    # Off by default. `SSR_ENABLED=true bin/dev` renders through the Vite dev server's
    # /__inertia_ssr endpoint; when Vite isn't up the page falls back to client rendering (and logs it).
    enabled: <%= get_env(name="SSR_ENABLED", default="false") %>
    spawn: false
    bundle: ssr/ssr.js
    timeout_ms: 1500
